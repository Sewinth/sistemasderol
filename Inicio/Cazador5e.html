  <style>
    :root {
      --bg-color: #111111;
      --surface-color: #1b1b1b;
      --border-color: #38332f;
      --heading-color: #c9b9a5;
      --text-color: #dedbd4;
      --muted-text: #aaa49b;
      --accent-color: #a65c52;
      --accent-light: #c86f64;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--bg-color);
      color: var(--text-color);
      font-family: "Barlow", "Barlow Semi Condensed", sans-serif;
      line-height: 1.6;
    }

    .hero-cabecera {
      position: relative;
      height: 260px;
      overflow: hidden;
      border-bottom: 2px solid var(--accent-color);
      text-align: center;
    }

    .cabecera {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      filter: brightness(0.45);
    }

    .hero-contenido {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .hero-contenido h1 {
      color: var(--heading-color);
      font-size: clamp(35px, 5vw, 46px);
      font-weight: normal;
      letter-spacing: 3px;
      text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.95);
    }

    .subtitle {
      margin-top: 8px;
      color: var(--text-color);
      font-size: 18px;
      text-shadow: 1px 1px 6px rgba(0, 0, 0, 0.9);
    }

    .hero-nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: clamp(36px, 8vh, 80px);
    }

    .btn-cabecera {
      padding: 7px 16px;
      border: 1px solid var(--accent-color);
      border-radius: 4px;
      background: rgba(17, 17, 17, 0.85);
      color: #e5e0d8;
      font-family: "Barlow", "Barlow Semi Condensed", sans-serif;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-decoration: none;
      text-transform: uppercase;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .btn-cabecera:hover {
      background: var(--accent-color);
      color: #ffffff;
    }

    .btn-cabecera:focus-visible {
      outline: 3px solid var(--accent-light);
      outline-offset: 4px;
    }

    main {
      max-width: 1050px;
      margin: 0 auto;
      padding: 55px 25px;
    }

    .contenido h2 {
      margin-bottom: 15px;
      color: var(--heading-color);
      font-size: 25px;
      font-weight: normal;
    }

    .contenido h3 {
      margin: 28px 0 10px;
      color: var(--heading-color);
      font-size: 20px;
      font-weight: normal;
    }

    .contenido p,
    .contenido li {
      color: var(--muted-text);
      font-size: 17px;
    }

    .contenido p {
      margin-bottom: 16px;
    }

    .contenido ul {
      margin: 0 0 20px 24px;
    }

    footer {
      border-top: 1px solid var(--border-color);
      padding: 28px 15px;
      color: var(--muted-text);
      font-family: Arial, sans-serif;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 650px) {
      .hero-cabecera {
        height: 300px;
      }

      main {
        padding: 40px 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>
