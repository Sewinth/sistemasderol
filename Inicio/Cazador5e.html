<head>

  <style>
    :root {
      --bg-color: #111;
      --surface-color: #181818;
      --card-color: #1b1b1b;
      --border-color: #333;
      --card-border-color: #34302d;
      --control-border-color: #45413d;
      --heading-color: #c9b9a5;
      --text-color: #e5e0d8;
      --muted-text: #aaa49b;
      --accent-color: #a65c52;
      --accent-light: #c86f64;
      --bone-color: #9e968b;
      --font-family: "Barlow", "Barlow Semi Condensed", sans-serif;
    }

    body {
      max-width: 950px;
      margin: 0 auto;
      background: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-family);
      line-height: 1.7;
    }

    a {
      color: var(--accent-color);
    }

    h1,
    h2,
    h3 {
      color: var(--heading-color);
    }

    ul,
    ol {
      margin-bottom: 20px;
      padding-left: 25px;
    }

    li {
      margin-bottom: 8px;
    }

    /* Cabecera */
    .hero-cabecera {
      position: relative;
      box-sizing: border-box;
      width: 100vw;
      height: 260px;
      margin: 0 0 30px calc(50% - 50vw);
      overflow: hidden;
      border-bottom: 2px solid var(--accent-color);
      text-align: center;
    }

    .cabecera {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      filter: brightness(0.45);
    }

    .hero-contenido {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .hero-contenido h1 {
      margin: 0;
      color: var(--heading-color);
      font-size: clamp(35px, 5vw, 46px);
      font-weight: normal;
      letter-spacing: 3px;
      text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.95);
    }

    .subtitle {
      margin-top: 8px;
      color: var(--text-color);
      font-size: 18px;
      text-shadow: 1px 1px 6px rgba(0, 0, 0, 0.9);
    }

    .hero-nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: clamp(36px, 8vh, 80px);
    }

    .btn-cabecera {
      padding: 7px 16px;
      border: 1px solid var(--accent-color);
      border-radius: 4px;
      background: rgba(17, 17, 17, 0.85);
      color: var(--text-color);
      font-family: var(--font-family);
      font-size: 12px;
      letter-spacing: 1.5px;
      text-decoration: none;
      text-transform: uppercase;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .btn-cabecera:hover {
      background: var(--accent-color);
      color: #fff;
    }

    .btn-cabecera:focus-visible {
      outline: 3px solid var(--accent-light);
      outline-offset: 4px;
    }

    /* Desplegables */
    details {
      margin-top: 25px;
      padding-left: 15px;
      border-left: 2px solid var(--accent-color);
    }

    summary {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      list-style: none;
      cursor: pointer;
      user-select: none;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    summary::before {
      color: var(--accent-color);
      content: "▸";
      font-size: 1.3em;
      line-height: 1.2;
      transition: transform 0.2s ease;
    }

    details[open] summary::before {
      transform: rotate(90deg);
    }

    .summary-title {
      display: block;
      color: var(--heading-color);
      font-size: 1.3em;
      font-weight: bold;
      line-height: 1.2;
    }

    summary:hover .summary-title {
      color: var(--accent-color);
    }

    .summary-desc {
      display: block;
      margin-top: 4px;
      color: var(--bone-color);
      font-size: 0.95em;
      font-style: italic;
      line-height: 1.4;
    }

    .details-content {
      margin-top: 15px;
      padding-left: 22px;
    }

    .details-content details .summary-title {
      font-size: 1em;
    }

    /* Tablas */
    table {
      width: 100%;
      margin: 25px 0;
      border-collapse: collapse;
      font-size: 0.95em;
    }

    th,
    td {
      padding: 12px 15px;
      border: 1px solid var(--border-color);
      text-align: left;
    }

    th {
      background: var(--surface-color);
      color: var(--heading-color);
    }

    @media (max-width: 650px) {
      .hero-cabecera {
        height: 300px;
      }
    }
  </style>
</head>

    <div class="hero-contenido">

    </article>
  </main>

  <footer>
    ARCHIVO DE ROL · BIBLIOTECA PERSONAL

</body>
</html>
